kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: nginx-child
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/deepak-ydv0/argo-cd.git
    targetRevision: main
    path: app_of_app
  destination:
    server: https://172.31.1.128:33893
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true